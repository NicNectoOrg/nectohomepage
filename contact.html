<section class="necto-contact" aria-labelledby="contact-heading">
  <div class="necto-contact__intro">
    <p class="necto-contact__eyebrow">Start a conversation</p>
    <h2 id="contact-heading">Tell us what is happening at your site.</h2>
    <p>
      Share a little about your operation, current energy challenges and what
      you want to achieve. NECTO will respond within two business days.
    </p>
  </div>

  <form id="contact-form" class="contact-form" novalidate>
    <div class="contact-form__grid">
      <label>
        <span>Name <b aria-hidden="true">*</b></span>
        <input name="name" type="text" autocomplete="name" maxlength="120" required />
      </label>

      <label>
        <span>Work email <b aria-hidden="true">*</b></span>
        <input name="email" type="email" autocomplete="email" maxlength="254" required />
      </label>

      <label>
        <span>Phone</span>
        <input name="phone" type="tel" autocomplete="tel" maxlength="50" />
      </label>

      <label>
        <span>Organisation</span>
        <input name="organisation" type="text" autocomplete="organization" maxlength="200" />
      </label>
    </div>

    <label>
      <span>How can NECTO help? <b aria-hidden="true">*</b></span>
      <textarea name="message" rows="7" maxlength="2000" required></textarea>
    </label>

    <!-- Hidden honeypot. Keep out of sight and out of the tab order. -->
    <label class="contact-form__website" aria-hidden="true">
      Website
      <input name="website" type="text" tabindex="-1" autocomplete="off" />
    </label>

    <label class="contact-form__consent">
      <input name="consent" type="checkbox" required />
      <span>
        I agree that NECTO may use these details to respond to my enquiry.
        See the <a href="/privacy">privacy policy</a>.
      </span>
    </label>

    <!-- Replace YOUR_TURNSTILE_SITE_KEY with the public site key. -->
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAFL4HIu9p98ZdCN9"></div>

    <div class="contact-form__actions">
      <button type="submit">Send enquiry</button>
      <p id="contact-status" role="status" aria-live="polite"></p>
    </div>
  </form>
</section>

<script>
  (() => {
    const form = document.getElementById("contact-form");
    const status = document.getElementById("contact-status");
    const button = form.querySelector('button[type="submit"]');
    let startedAt = Date.now();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "";
      status.removeAttribute("data-state");

      if (!form.reportValidity()) return;

      const data = new FormData(form);
      const turnstileToken = data.get("cf-turnstile-response");
      if (!turnstileToken) {
        status.textContent = "Please complete the security check.";
        status.dataset.state = "error";
        return;
      }

      button.disabled = true;
      button.textContent = "Sending…";

      try {
        const response = await fetch("/api/contact", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            name: data.get("name"),
            email: data.get("email"),
            phone: data.get("phone"),
            organisation: data.get("organisation"),
            message: data.get("message"),
            website: data.get("website"),
            consent: data.get("consent") === "on",
            turnstileToken,
            startedAt,
            sourcePage: window.location.href,
          }),
        });

        const result = await response.json();
        if (!response.ok || !result.ok) {
          throw new Error(result.error || "We could not send your message.");
        }

        form.reset();
        if (window.turnstile) window.turnstile.reset();
        startedAt = Date.now();
        status.textContent = "Thanks. Your enquiry has been sent.";
        status.dataset.state = "success";
      } catch (error) {
        status.textContent = error.message || "We could not send your message. Please try again.";
        status.dataset.state = "error";
        if (window.turnstile) window.turnstile.reset();
      } finally {
        button.disabled = false;
        button.textContent = "Send enquiry";
      }
    });
  })();
</script>
